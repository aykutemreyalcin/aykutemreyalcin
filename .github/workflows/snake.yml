name: Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Snake is orange (Fos/Enretag accent), dots follow the radar blue.
          outputs: |
            dist/snake-light.svg?color_snake=#bc4c00&color_dots=#ebedf0,#bfd6f6,#8dbdff,#4b91f1,#1f5fb8
            dist/snake-dark.svg?color_snake=#f0883e&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: refresh snake animation [skip ci]"
