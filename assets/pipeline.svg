<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="215" viewBox="0 0 880 215" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">Order fulfillment pipeline</title>
  <desc id="pipeDesc">Packets flowing from order sources through a Spring API and queue into fulfillment and carriers, with a retry loop back to the API.</desc>

  <style>
    svg {
      --bg: #ffffff;
      --card: #f6f8fa;
      --line: #d0d7de;
      --fg: #1f2328;
      --muted: #6e7781;
      --accent: #4b91f1;
      --green: #2da44e;
      --orange: #bc4c00;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --card: #161b22;
        --line: #30363d;
        --fg: #e6edf3;
        --muted: #8b949e;
        --accent: #64a1f4;
        --green: #3fb950;
        --orange: #f0883e;
      }
    }
    .bg     { fill: var(--bg); }
    .card   { fill: var(--card); }
    .stroke { stroke: var(--line); fill: none; }
    .fg     { fill: var(--fg); }
    .muted  { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .green  { fill: var(--green); }
    .mono   { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .name   { font-size: 12px; font-weight: 600; }
    .sub    { font-size: 8.5px; letter-spacing: 0.06em; }
    .tiny   { font-size: 9px; letter-spacing: 0.08em; }

    .wire   { stroke: var(--line); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4;
              animation: march 1s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -8; } }

    .retry  { stroke: var(--orange); stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; opacity: 0.8;
              animation: marchBack 1.2s linear infinite; }
    @keyframes marchBack { to { stroke-dashoffset: 14; } }

    .pkt    { fill: var(--accent); }
    .pktAlt { fill: var(--green); }
    .arrow  { fill: var(--orange); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow" d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="215" rx="16"/>
  <rect class="stroke" x="0.5" y="0.5" width="879" height="214" rx="16"/>

  <text class="mono tiny muted" x="30" y="34">HOW AN ORDER MOVES THROUGH THE SYSTEMS I BUILD</text>

  <!-- ===== wires ===== -->
  <line class="wire" x1="150" y1="95" x2="196" y2="95"/>
  <line class="wire" x1="320" y1="95" x2="366" y2="95"/>
  <line class="wire" x1="490" y1="95" x2="536" y2="95"/>
  <line class="wire" x1="660" y1="95" x2="706" y2="95"/>

  <!-- ===== nodes ===== -->
  <g>
    <rect class="card" x="30" y="64" width="120" height="62" rx="9"/>
    <rect class="stroke" x="30.5" y="64.5" width="119" height="61" rx="9"/>
    <text class="mono name fg"   x="90" y="90"  text-anchor="middle">order sources</text>
    <text class="mono sub muted" x="90" y="107" text-anchor="middle">shopify / faire</text>
  </g>
  <g>
    <rect class="card" x="200" y="64" width="120" height="62" rx="9"/>
    <rect class="stroke" x="200.5" y="64.5" width="119" height="61" rx="9"/>
    <text class="mono name fg"   x="260" y="90"  text-anchor="middle">spring api</text>
    <text class="mono sub muted" x="260" y="107" text-anchor="middle">java / postgres</text>
  </g>
  <g>
    <rect class="card" x="370" y="64" width="120" height="62" rx="9"/>
    <rect class="stroke" x="370.5" y="64.5" width="119" height="61" rx="9"/>
    <text class="mono name fg"   x="430" y="90"  text-anchor="middle">queue</text>
    <text class="mono sub muted" x="430" y="107" text-anchor="middle">idempotent jobs</text>
  </g>
  <g>
    <rect class="card" x="540" y="64" width="120" height="62" rx="9"/>
    <rect class="stroke" x="540.5" y="64.5" width="119" height="61" rx="9"/>
    <text class="mono name fg"   x="600" y="90"  text-anchor="middle">fulfillment</text>
    <text class="mono sub muted" x="600" y="107" text-anchor="middle">pick / pack / ship</text>
  </g>
  <g>
    <rect class="card" x="710" y="64" width="120" height="62" rx="9"/>
    <rect class="stroke" x="710.5" y="64.5" width="119" height="61" rx="9"/>
    <text class="mono name fg"   x="770" y="90"  text-anchor="middle">carriers</text>
    <text class="mono sub muted" x="770" y="107" text-anchor="middle">label + tracking</text>
  </g>

  <!-- ===== packets ===== -->
  <g>
    <rect class="pkt" x="150" y="91" width="8" height="8" rx="2">
      <animate attributeName="x" dur="1.4s" repeatCount="indefinite" values="150;192"/>
      <animate attributeName="opacity" dur="1.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
    </rect>
    <rect class="pktAlt" x="150" y="91" width="8" height="8" rx="2">
      <animate attributeName="x" dur="1.4s" begin="0.7s" repeatCount="indefinite" values="150;192"/>
      <animate attributeName="opacity" dur="1.4s" begin="0.7s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
    </rect>

    <rect class="pkt" x="320" y="91" width="8" height="8" rx="2">
      <animate attributeName="x" dur="1.4s" begin="0.25s" repeatCount="indefinite" values="320;362"/>
      <animate attributeName="opacity" dur="1.4s" begin="0.25s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
    </rect>
    <rect class="pktAlt" x="320" y="91" width="8" height="8" rx="2">
      <animate attributeName="x" dur="1.4s" begin="0.95s" repeatCount="indefinite" values="320;362"/>
      <animate attributeName="opacity" dur="1.4s" begin="0.95s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
    </rect>

    <rect class="pkt" x="490" y="91" width="8" height="8" rx="2">
      <animate attributeName="x" dur="1.4s" begin="0.5s" repeatCount="indefinite" values="490;532"/>
      <animate attributeName="opacity" dur="1.4s" begin="0.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
    </rect>
    <rect class="pktAlt" x="490" y="91" width="8" height="8" rx="2">
      <animate attributeName="x" dur="1.4s" begin="1.2s" repeatCount="indefinite" values="490;532"/>
      <animate attributeName="opacity" dur="1.4s" begin="1.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
    </rect>

    <rect class="pkt" x="660" y="91" width="8" height="8" rx="2">
      <animate attributeName="x" dur="1.4s" begin="0.75s" repeatCount="indefinite" values="660;702"/>
      <animate attributeName="opacity" dur="1.4s" begin="0.75s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
    </rect>
    <rect class="pktAlt" x="660" y="91" width="8" height="8" rx="2">
      <animate attributeName="x" dur="1.4s" begin="1.45s" repeatCount="indefinite" values="660;702"/>
      <animate attributeName="opacity" dur="1.4s" begin="1.45s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
    </rect>
  </g>

  <!-- ===== retry loop ===== -->
  <path class="retry" d="M430,126 C430,180 260,180 260,134" marker-end="url(#arrow)"/>
  <text class="mono sub muted" x="345" y="196" text-anchor="middle">failures retry, then land in the dead letter queue</text>

  <text class="mono tiny muted" x="850" y="34" text-anchor="end">1.5M+ ORDERS SHIPPED</text>
</svg>
